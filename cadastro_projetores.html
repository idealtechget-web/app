<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapeamento de Projetores - IdealTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">
    </script>
    <style>
        /* pequenos ajustes para o spinner e progresso */
        .spinner {
            border: 3px solid #e2e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #progressBar {
            transition: width 0.2s ease;
            background: #3b82f6;
            height: 4px;
            border-radius: 2px;
        }
        #progressContainer {
            background: #e2e8f0;
            border-radius: 2px;
            height: 4px;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Mapeamento de Projetores</h1>
            <p class="text-sm text-slate-500">Cadastro por Sala e OCR</p>
        </div>

        <form id="projectorForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Número da Sala</label>
                <input type="text" id="sala" required
                    class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Ex: Sala 101">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700">Número do Patrimônio</label>
                <input type="text" id="patrimonio" required
                    class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Ex: 987654">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Número de Série (Serial)</label>

                <div class="flex items-center gap-2 mb-2">
                    <label
                        class="cursor-pointer bg-blue-100 text-blue-700 px-4 py-2 rounded-md font-medium text-sm flex-1 text-center hover:bg-blue-200 transition">
                        📷 Tirar Foto do Serial
                        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
                    </label>
                </div>

                <!-- Área de feedback do OCR -->
                <div id="ocrFeedback" class="mb-2 hidden">
                    <div class="flex items-center gap-3 text-sm">
                        <div class="spinner"></div>
                        <span id="ocrMessage" class="text-blue-600">Processando imagem...</span>
                    </div>
                    <div id="progressContainer" class="mt-1">
                        <div id="progressBar" style="width:0%"></div>
                    </div>
                </div>

                <input type="text" id="serial" required
                    class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Digite ou escaneie o serial">
            </div>

            <div class="flex gap-2">
                <button type="submit" id="btnSubmit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-slate-800 hover:bg-slate-900 focus:outline-none transition disabled:opacity-60 disabled:cursor-not-allowed">
                    Vincular e Salvar
                </button>
                <button type="button" id="btnCancelEdit"
                    class="hidden py-2 px-4 border border-slate-300 rounded-md shadow-sm text-sm font-medium text-slate-700 bg-white hover:bg-slate-50 focus:outline-none transition">
                    Cancelar
                </button>
            </div>
        </form>

        <div class="mt-8 border-t pt-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-800">Registros (<span id="count">0</span>)</h2>
                <button id="btnExport"
                    class="text-sm bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700 transition">
                    Exportar JSON
                </button>
            </div>
            <ul id="registrosList" class="space-y-2 text-sm max-h-60 overflow-y-auto pr-1">
                <!-- Itens salvos aparecerão aqui -->
            </ul>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ----- CONSTANTS -----
            const MAX_IMAGE_WIDTH = 1200;
            const JPEG_QUALITY = 0.8;
            const OCR_LANG = 'eng+por';
            const STORAGE_KEY = 'projetores_db';

            // ----- DOM REFERENCES -----
            const form = document.getElementById('projectorForm');
            const cameraInput = document.getElementById('cameraInput');
            const serialInput = document.getElementById('serial');
            const salaInput = document.getElementById('sala');
            const patrimonioInput = document.getElementById('patrimonio');
            const registrosList = document.getElementById('registrosList');
            const countSpan = document.getElementById('count');
            const btnExport = document.getElementById('btnExport');
            const btnSubmit = document.getElementById('btnSubmit');
            const btnCancelEdit = document.getElementById('btnCancelEdit');
            const ocrFeedback = document.getElementById('ocrFeedback');
            const ocrMessage = document.getElementById('ocrMessage');
            const progressBar = document.getElementById('progressBar');

            // ----- STATE -----
            let projetores = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            let editIndex = -1;
            let isProcessingOCR = false;

            // ----- HELPERS -----

            // Redimensiona a imagem para uma largura máxima (mantém proporção) e retorna um canvas
            function resizeImage(file) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_IMAGE_WIDTH) {
                            const ratio = MAX_IMAGE_WIDTH / width;
                            width = MAX_IMAGE_WIDTH;
                            height = height * ratio;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);

                        // Opcional: aplicar filtro de contraste/brilho? (deixamos simples)
                        resolve(canvas);
                    };
                    img.onerror = () => reject(new Error('Falha ao carregar a imagem.'));
                    img.src = URL.createObjectURL(file);
                });
            }

            // Extrai o texto e tenta isolar um possível número de série
            function postProcessText(rawText) {
                let cleaned = rawText
                    .replace(/\n/g, ' ')
                    .replace(/\s{2,}/g, ' ')
                    .trim();

                // Tenta encontrar um padrão comum de serial (ex.: alfanumérico com traços ou sublinhados)
                const match = cleaned.match(/[A-Z0-9][A-Z0-9\-_]{5,}/i);
                if (match) {
                    return match[0].toUpperCase();
                }
                return cleaned;
            }

            // ----- OCR FUNCTION -----
            async function performOCR(file) {
                // 1. Redimensionar
                const canvas = await resizeImage(file);

                // 2. Configurar feedback
                showOcrFeedback('Processando OCR...', 0);
                btnSubmit.disabled = true;

                try {
                    // 3. Executar Tesseract com logger
                    const result = await Tesseract.recognize(canvas, OCR_LANG, {
                        logger: (m) => {
                            if (m.status === 'recognizing text') {
                                const progress = m.progress || 0;
                                updateOcrProgress(progress);
                                if (progress < 1) {
                                    ocrMessage.textContent = `Reconhecendo texto (${Math.round(progress * 100)}%)...`;
                                }
                            }
                        }
                    });

                    const rawText = result.data.text;
                    const serial = postProcessText(rawText);

                    if (serial.length > 2) {
                        serialInput.value = serial;
                        ocrMessage.textContent = '✅ Serial identificado!';
                        ocrMessage.className = 'text-green-600';
                    } else {
                        ocrMessage.textContent = '⚠️ Não foi possível identificar um serial. Digite manualmente.';
                        ocrMessage.className = 'text-amber-600';
                    }

                    // Mantém o progresso em 100% por um instante
                    updateOcrProgress(1);
                } catch (err) {
                    console.error('Erro no OCR:', err);
                    ocrMessage.textContent = '❌ Falha ao ler a imagem. Tente novamente ou digite manualmente.';
                    ocrMessage.className = 'text-red-600';
                } finally {
                    btnSubmit.disabled = false;
                    // Esconde o feedback após alguns segundos, mas mantém a mensagem
                    setTimeout(() => {
                        hideOcrFeedback();
                    }, 4000);
                    // Limpa o input file para permitir nova captura
                    cameraInput.value = '';
                    isProcessingOCR = false;
                }
            }

            // ----- UI FEEDBACK -----
            function showOcrFeedback(message, progress = 0) {
                ocrFeedback.classList.remove('hidden');
                ocrMessage.textContent = message;
                ocrMessage.className = 'text-blue-600';
                updateOcrProgress(progress);
            }

            function updateOcrProgress(value) {
                const clamped = Math.min(1, Math.max(0, value));
                progressBar.style.width = (clamped * 100) + '%';
            }

            function hideOcrFeedback() {
                ocrFeedback.classList.add('hidden');
                progressBar.style.width = '0%';
            }

            // ----- RENDER LIST -----
            function renderList() {
                registrosList.innerHTML = '';
                countSpan.textContent = projetores.length;

                projetores.forEach((p, index) => {
                    const li = document.createElement('li');
                    li.className =
                        'bg-slate-50 p-3 rounded border border-slate-200 flex justify-between items-center gap-2';
                    li.innerHTML = `
                        <div class="flex-1">
                            <span class="font-bold text-slate-700">Sala ${p.sala}</span><br>
                            <span class="text-xs text-slate-500">Pat: ${p.patrimonio} | SN: ${p.serial}</span>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="window.editarItem(${index})" class="text-blue-600 hover:text-blue-800" title="Editar">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                                </svg>
                            </button>
                            <button onclick="window.removerItem(${index})" class="text-red-500 hover:text-red-700" title="Excluir">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                                </svg>
                            </button>
                        </div>
                    `;
                    registrosList.appendChild(li);
                });
            }

            // ----- EDIT / DELETE HELPERS (global) -----
            window.editarItem = function(index) {
                const p = projetores[index];
                salaInput.value = p.sala;
                patrimonioInput.value = p.patrimonio;
                serialInput.value = p.serial;

                editIndex = index;

                btnSubmit.textContent = 'Atualizar Registro';
                btnSubmit.classList.replace('bg-slate-800', 'bg-blue-600');
                btnSubmit.classList.replace('hover:bg-slate-900', 'hover:bg-blue-700');
                btnCancelEdit.classList.remove('hidden');

                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            window.removerItem = function(index) {
                if (confirm('Tem certeza que deseja remover o registro desta sala?')) {
                    projetores.splice(index, 1);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(projetores));

                    if (editIndex === index) {
                        form.reset();
                        resetEditMode();
                    } else if (editIndex > index) {
                        editIndex--;
                    }

                    renderList();
                }
            };

            // ----- EDIT MODE -----
            function resetEditMode() {
                editIndex = -1;
                btnSubmit.textContent = 'Vincular e Salvar';
                btnSubmit.classList.replace('bg-blue-600', 'bg-slate-800');
                btnSubmit.classList.replace('hover:bg-blue-700', 'hover:bg-slate-900');
                btnCancelEdit.classList.add('hidden');
            }

            // ----- FORM SUBMIT -----
            form.addEventListener('submit', (e) => {
                e.preventDefault();

                if (isProcessingOCR) {
                    alert('Aguarde o processamento da imagem.');
                    return;
                }

                const sala = salaInput.value.trim();
                const patrimonio = patrimonioInput.value.trim();
                const serial = serialInput.value.trim();

                if (!sala || !patrimonio || !serial) {
                    alert('Preencha todos os campos antes de salvar.');
                    return;
                }

                const dadosForm = {
                    sala,
                    patrimonio,
                    serial,
                    data_registro: new Date().toISOString()
                };

                if (editIndex === -1) {
                    projetores.push(dadosForm);
                } else {
                    dadosForm.data_registro = projetores[editIndex].data_registro;
                    projetores[editIndex] = dadosForm;
                    resetEditMode();
                }

                localStorage.setItem(STORAGE_KEY, JSON.stringify(projetores));
                form.reset();
                renderList();
                // Limpa feedback se estiver visível
                hideOcrFeedback();
            });

            // ----- CANCEL EDIT -----
            btnCancelEdit.addEventListener('click', () => {
                form.reset();
                resetEditMode();
                hideOcrFeedback();
            });

            // ----- CAMERA INPUT (OCR) -----
            cameraInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (isProcessingOCR) return;
                isProcessingOCR = true;

                try {
                    await performOCR(file);
                } catch (err) {
                    console.error('Erro geral no OCR:', err);
                    ocrMessage.textContent = '❌ Erro inesperado. Tente novamente.';
                    ocrMessage.className = 'text-red-600';
                    btnSubmit.disabled = false;
                    isProcessingOCR = false;
                    setTimeout(hideOcrFeedback, 4000);
                }
            });

            // ----- EXPORT -----
            btnExport.addEventListener('click', () => {
                if (projetores.length === 0) {
                    alert('Nenhum dado para exportar.');
                    return;
                }
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projetores, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", "mapeamento_projetores.json");
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            });

            // ----- INIT -----
            renderList();
            resetEditMode();

        })();
    </script>
</body>
</html>
