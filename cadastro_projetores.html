<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapeamento de Projetores - Bom Jesus Porto Belo</title>

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tesseract (OCR) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <!-- jsPDF (PDF Export) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <!-- Cropper.js (Recorte de Imagem) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        .spinner {
            border: 3px solid #e2e8f0;
            border-top-color: #14532d;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #progressBar {
            transition: width 0.2s ease;
            background: #14532d;
            height: 4px;
            border-radius: 2px;
        }
        #progressContainer {
            background: #e2e8f0;
            border-radius: 2px;
            height: 4px;
            overflow: hidden;
        }
        
        .cropper-container {
            max-height: 100%;
        }
        
        .cropper-container,
        .cropper-drag-box,
        .cropper-crop-box,
        .cropper-wrap-box {
            touch-action: none;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .cropper-point {
            width: 24px !important;
            height: 24px !important;
            background-color: #16a34a !important;
            border-radius: 50% !important;
            opacity: 0.9 !important;
        }
        
        .cropper-point.e { top: calc(50% - 12px); right: -12px; }
        .cropper-point.n { left: calc(50% - 12px); top: -12px; }
        .cropper-point.w { top: calc(50% - 12px); left: -12px; }
        .cropper-point.s { left: calc(50% - 12px); bottom: -12px; }
        .cropper-point.ne { right: -12px; top: -12px; }
        .cropper-point.nw { left: -12px; top: -12px; }
        .cropper-point.sw { left: -12px; bottom: -12px; }
        .cropper-point.se { right: -12px; bottom: -12px; }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid #14532d;
            outline-offset: 2px;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 border-t-4 border-green-900">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-green-900">Mapeamento de Projetores</h1>
            <p class="text-sm text-green-800 font-medium mt-1">Colégio Bom Jesus Porto Belo</p>
        </div>

        <form id="projectorForm" class="space-y-4" novalidate>
            <div>
                <label for="sala" class="block text-sm font-medium text-slate-700">Número da Sala</label>
                <input type="text" id="sala" required
                class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-green-900 focus:border-green-900"
                placeholder="Ex: Sala 101">
            </div>

            <div>
                <label for="patrimonio" class="block text-sm font-medium text-slate-700">Número do Patrimônio</label>
                <input type="text" id="patrimonio" required
                class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-green-900 focus:border-green-900"
                placeholder="Ex: 987654">
            </div>

            <div>
                <label for="serial" class="block text-sm font-medium text-slate-700 mb-1">Número de Série (Serial)</label>

                <div class="flex items-center gap-2 mb-2">
                    <label for="cameraInput" class="cursor-pointer bg-green-100 text-green-900 px-4 py-2 rounded-md font-medium text-sm flex-1 flex justify-center items-center gap-2 hover:bg-green-200 transition border border-green-200">
                        <i class="ph ph-camera text-lg"></i> Tirar Foto e Recortar
                        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
                    </label>
                </div>

                <div id="ocrFeedback" class="mb-2 hidden">
                    <div class="flex items-center gap-3 text-sm">
                        <div class="spinner" aria-hidden="true"></div>
                        <span id="ocrMessage" class="text-green-900 font-medium">Processando recorte...</span>
                    </div>
                    <div id="progressContainer" class="mt-1" aria-hidden="true">
                        <div id="progressBar" style="width:0%"></div>
                    </div>
                </div>

                <input type="text" id="serial" required
                class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-green-900 focus:border-green-900"
                placeholder="Digite ou escaneie o serial">

                <div id="croppedPreviewContainer" class="mt-2 hidden">
                    <p class="text-xs text-slate-500 mb-1">Recorte salvo (prova visual):</p>
                    <div class="flex items-center gap-2">
                        <img id="croppedPreview" src="" class="border border-slate-300 rounded max-h-16" alt="Prévia do recorte do serial">
                        <button type="button" id="btnClearImage" class="text-red-500 hover:text-red-700 text-xs font-medium" aria-label="Remover recorte">
                            <i class="ph ph-x-circle text-base align-text-bottom"></i> Remover
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex gap-2">
                <button type="submit" id="btnSubmit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-white bg-green-900 hover:bg-green-800 focus:outline-none transition disabled:opacity-60 disabled:cursor-not-allowed">
                    <i class="ph ph-floppy-disk text-lg align-text-bottom mr-1"></i> Vincular e Salvar
                </button>
                <button type="button" id="btnCancelEdit" class="hidden py-2 px-4 border border-slate-300 rounded-md shadow-sm text-sm font-medium text-slate-700 bg-white hover:bg-slate-50 focus:outline-none transition">
                    Cancelar
                </button>
            </div>
        </form>

        <div class="mt-8 border-t pt-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-800">Registros (<span id="count">0</span>)</h2>
                <div class="flex gap-2">
                    <label for="btnImport" class="cursor-pointer flex items-center gap-1 text-sm bg-slate-600 text-white px-3 py-1 rounded hover:bg-slate-700 transition" title="Importar backup">
                        <i class="ph ph-upload-simple"></i> JSON
                        <input type="file" id="btnImport" accept=".json" class="hidden">
                    </label>

                    <button id="btnExportPDF" class="flex items-center gap-1 text-sm bg-green-900 text-white px-3 py-1 rounded hover:bg-green-800 transition shadow" aria-label="Exportar relatório em PDF">
                        <i class="ph ph-file-pdf"></i> PDF
                    </button>
                    <button id="btnExport" class="flex items-center gap-1 text-sm bg-slate-800 text-white px-3 py-1 rounded hover:bg-slate-900 transition" aria-label="Exportar backup JSON">
                        <i class="ph ph-download-simple"></i> JSON
                    </button>
                </div>
            </div>
            <ul id="registrosList" class="space-y-2 text-sm max-h-60 overflow-y-auto pr-1">
                <!-- Renderizado via JS -->
            </ul>
        </div>
    </div>

    <!-- MODAL DO CROPPER.JS -->
    <div id="imagePreviewModal" class="fixed inset-0 bg-slate-900 bg-opacity-95 z-50 hidden flex flex-col items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h3 id="modalTitle" class="text-white font-bold mb-2 text-center text-sm">Isole SOMENTE o serial e alinhe a imagem</h3>

        <div class="w-full max-w-sm h-72 bg-black flex items-center justify-center overflow-hidden border border-slate-600">
            <img id="imageToCrop" class="max-w-full hidden" alt="Imagem a ser recortada">
        </div>
        
        <div class="flex flex-col items-center w-full max-w-sm mt-3 mb-4">
            <label for="fineRotation" class="text-slate-300 text-xs mb-1">Ajuste fino de inclinação</label>
            <input type="range" id="fineRotation" min="-45" max="45" value="0" class="w-full accent-green-600">
        </div>

        <div class="flex flex-col gap-3 w-full max-w-sm">
            <button id="btnRotate" class="bg-slate-700 text-white font-semibold py-2 rounded-md shadow hover:bg-slate-600 transition flex justify-center items-center gap-2" aria-label="Girar imagem 90 graus">
                <i class="ph ph-arrow-clockwise text-xl" aria-hidden="true"></i> Tombo de 90º
            </button>
            <button id="btnConfirmCrop" class="bg-green-600 text-white font-semibold py-3 rounded-md shadow hover:bg-green-700 transition flex justify-center items-center gap-2" aria-label="Cortar e ler serial">
                <i class="ph ph-crop text-xl" aria-hidden="true"></i> Cortar e Ler Serial
            </button>
            <button id="btnCancelModal" class="bg-red-600 text-white font-semibold py-2 rounded-md hover:bg-red-700 transition flex justify-center items-center gap-2" aria-label="Cancelar e fechar">
                <i class="ph ph-x text-xl" aria-hidden="true"></i> Cancelar
            </button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const OCR_LANG = 'eng';
            const STORAGE_KEY = 'projetores_db';
            const IMAGE_QUALITY = 0.4;

            const DOM = {
                form: document.getElementById('projectorForm'),
                sala: document.getElementById('sala'),
                patrimonio: document.getElementById('patrimonio'),
                serial: document.getElementById('serial'),
                cameraInput: document.getElementById('cameraInput'),
                btnSubmit: document.getElementById('btnSubmit'),
                btnCancelEdit: document.getElementById('btnCancelEdit'),
                registrosList: document.getElementById('registrosList'),
                count: document.getElementById('count'),
                btnImport: document.getElementById('btnImport'),
                btnExport: document.getElementById('btnExport'),
                btnExportPDF: document.getElementById('btnExportPDF'),
                ocrFeedback: document.getElementById('ocrFeedback'),
                ocrMessage: document.getElementById('ocrMessage'),
                progressBar: document.getElementById('progressBar'),
                croppedPreviewContainer: document.getElementById('croppedPreviewContainer'),
                croppedPreview: document.getElementById('croppedPreview'),
                btnClearImage: document.getElementById('btnClearImage'),
                modal: document.getElementById('imagePreviewModal'),
                imageToCrop: document.getElementById('imageToCrop'),
                fineRotation: document.getElementById('fineRotation'),
                btnRotate: document.getElementById('btnRotate'),
                btnConfirmCrop: document.getElementById('btnConfirmCrop'),
                btnCancelModal: document.getElementById('btnCancelModal'),
            };

            let projetores = [];
            let editIndex = -1;
            let isProcessingOCR = false;
            let cropperInstance = null;
            let currentImageBase64 = null;
            let currentObjectUrl = null;
            let currentBaseRotation = 0;

            const App = {
                loadData() {
                    const stored = localStorage.getItem(STORAGE_KEY);
                    projetores = stored ? JSON.parse(stored) : [];
                    this.renderList();
                },

                saveData() {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(projetores));
                    this.renderList();
                },

                renderList() {
                    const sorted = [...projetores].sort((a, b) => {
                        const salaA = a.sala || '';
                        const salaB = b.sala || '';
                        return salaA.localeCompare(salaB, undefined, { numeric: true, sensitivity: 'base' });
                    });

                    DOM.registrosList.innerHTML = '';
                    DOM.count.textContent = projetores.length;

                    sorted.forEach((p) => {
                        const originalIndex = projetores.indexOf(p);
                        const li = document.createElement('li');
                        li.className =
                            'bg-slate-50 p-3 rounded border border-slate-200 flex justify-between items-center gap-2 border-l-4 border-l-green-900';

                        const imgTag = p.imagem ?
                            `<img src="${p.imagem}" class="h-8 mt-2 rounded border border-slate-300" alt="Recorte do serial">` :
                            '';

                        li.innerHTML = `
                            <div class="flex-1">
                                <span class="font-bold text-slate-800">${p.sala || '—'}</span><br>
                                <span class="text-xs text-slate-600">Pat: <strong>${p.patrimonio || '—'}</strong> | SN: <strong>${p.serial || '—'}</strong></span>
                                ${imgTag}
                            </div>
                            <div class="flex gap-3">
                                <button type="button" data-index="${originalIndex}" class="btn-edit text-slate-500 hover:text-green-900 transition" aria-label="Editar registro">
                                    <i class="ph ph-pencil-simple text-xl" aria-hidden="true"></i>
                                </button>
                                <button type="button" data-index="${originalIndex}" class="btn-delete text-red-400 hover:text-red-700 transition" aria-label="Excluir registro">
                                    <i class="ph ph-trash text-xl" aria-hidden="true"></i>
                                </button>
                            </div>
                        `;
                        DOM.registrosList.appendChild(li);
                    });

                    DOM.registrosList.querySelectorAll('.btn-edit').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const idx = parseInt(btn.dataset.index, 10);
                            this.editItem(idx);
                        });
                    });
                    DOM.registrosList.querySelectorAll('.btn-delete').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const idx = parseInt(btn.dataset.index, 10);
                            this.deleteItem(idx);
                        });
                    });
                },

                editItem(index) {
                    const p = projetores[index];
                    if (!p) return;
                    DOM.sala.value = p.sala || '';
                    DOM.patrimonio.value = p.patrimonio || '';
                    DOM.serial.value = p.serial || '';
                    if (p.imagem) {
                        currentImageBase64 = p.imagem;
                        DOM.croppedPreview.src = p.imagem;
                        DOM.croppedPreviewContainer.classList.remove('hidden');
                    } else {
                        currentImageBase64 = null;
                        DOM.croppedPreviewContainer.classList.add('hidden');
                    }
                    editIndex = index;
                    DOM.btnSubmit.innerHTML = '<i class="ph ph-pencil-simple text-lg align-text-bottom mr-1"></i> Atualizar Registro';
                    DOM.btnSubmit.classList.replace('bg-green-900', 'bg-blue-600');
                    DOM.btnSubmit.classList.replace('hover:bg-green-800', 'hover:bg-blue-700');
                    DOM.btnCancelEdit.classList.remove('hidden');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                deleteItem(index) {
                    if (!confirm('Tem certeza que deseja remover este registro?')) return;
                    projetores.splice(index, 1);
                    if (editIndex === index) {
                        this.cancelEdit();
                    } else if (editIndex > index) {
                        editIndex--;
                    }
                    this.saveData();
                },

                cancelEdit() {
                    editIndex = -1;
                    DOM.btnSubmit.innerHTML = '<i class="ph ph-floppy-disk text-lg align-text-bottom mr-1"></i> Vincular e Salvar';
                    DOM.btnSubmit.classList.replace('bg-blue-600', 'bg-green-900');
                    DOM.btnSubmit.classList.replace('hover:bg-blue-700', 'hover:bg-green-800');
                    DOM.btnCancelEdit.classList.add('hidden');
                    DOM.form.reset();
                    this.clearImagePreview();
                    DOM.sala.focus();
                },

                clearImagePreview() {
                    currentImageBase64 = null;
                    DOM.croppedPreviewContainer.classList.add('hidden');
                    DOM.croppedPreview.src = '';
                },

                showOcrFeedback(message, progress = 0) {
                    DOM.ocrFeedback.classList.remove('hidden');
                    DOM.ocrMessage.innerHTML = message;
                    this.updateOcrProgress(progress);
                },

                updateOcrProgress(value) {
                    const clamped = Math.min(1, Math.max(0, value));
                    DOM.progressBar.style.width = (clamped * 100) + '%';
                },

                hideOcrFeedback() {
                    DOM.ocrFeedback.classList.add('hidden');
                    DOM.progressBar.style.width = '0%';
                },

                destroyCropper() {
                    if (cropperInstance) {
                        cropperInstance.destroy();
                        cropperInstance = null;
                    }
                    if (currentObjectUrl) {
                        URL.revokeObjectURL(currentObjectUrl);
                        currentObjectUrl = null;
                    }
                    DOM.imageToCrop.classList.add('hidden');
                    DOM.imageToCrop.src = '';
                },

                openModal(file) {
                    const url = URL.createObjectURL(file);
                    currentObjectUrl = url;
                    DOM.imageToCrop.src = url;
                    DOM.imageToCrop.classList.remove('hidden');
                    DOM.modal.classList.remove('hidden');
                    
                    currentBaseRotation = 0;
                    DOM.fineRotation.value = 0;

                    if (cropperInstance) {
                        this.destroyCropper();
                    }

                    cropperInstance = new Cropper(DOM.imageToCrop, {
                        viewMode: 1,
                        dragMode: 'move',
                        autoCropArea: 0.8,
                        restore: false,
                        guides: true,
                        center: true,
                        highlight: false,
                        cropBoxMovable: true,
                        cropBoxResizable: true,
                        toggleDragModeOnDblclick: false,
                    });

                    DOM.btnRotate.focus();
                },

                closeModal() {
                    DOM.modal.classList.add('hidden');
                    this.destroyCropper();
                    DOM.cameraInput.focus();
                },

                async processCrop() {
                    if (isProcessingOCR || !cropperInstance) return;
                    isProcessingOCR = true;
                    DOM.btnSubmit.disabled = true;
                    DOM.cameraInput.disabled = true;

                    try {
                        const canvas = cropperInstance.getCroppedCanvas();
                        currentImageBase64 = canvas.toDataURL('image/jpeg', IMAGE_QUALITY);
                        DOM.croppedPreview.src = currentImageBase64;
                        DOM.croppedPreviewContainer.classList.remove('hidden');

                        this.showOcrFeedback('Lendo recorte...', 0);

                        const result = await Tesseract.recognize(canvas, OCR_LANG, {
                            logger: (m) => {
                                if (m.status === 'recognizing text') {
                                    const progress = m.progress || 0;
                                    this.updateOcrProgress(progress);
                                    if (progress < 1) {
                                        DOM.ocrMessage.innerHTML = `Lendo (${Math.round(progress * 100)}%)...`;
                                    }
                                }
                            }
                        });

                        let rawText = result.data.text;
                        let cleanedSerial = rawText.replace(/[^A-Za-z0-9]/g, '').toUpperCase();

                        if (cleanedSerial.length >= 5) {
                            DOM.serial.value = cleanedSerial;
                            DOM.ocrMessage.innerHTML = '<i class="ph ph-check-circle text-lg align-text-bottom mr-1"></i> Finalizado! Confira o serial.';
                            DOM.ocrMessage.className = 'text-green-600';
                        } else {
                            DOM.ocrMessage.innerHTML = '<i class="ph ph-warning text-lg align-text-bottom mr-1"></i> OCR falhou. Digite o serial.';
                            DOM.ocrMessage.className = 'text-amber-600';
                        }
                        this.updateOcrProgress(1);
                    } catch (err) {
                        console.error('Erro no OCR:', err);
                        DOM.ocrMessage.innerHTML = '<i class="ph ph-x-circle text-lg align-text-bottom mr-1"></i> Falha ao ler. Use a foto para digitar.';
                        DOM.ocrMessage.className = 'text-red-600';
                    } finally {
                        isProcessingOCR = false;
                        DOM.btnSubmit.disabled = false;
                        DOM.cameraInput.disabled = false;
                        setTimeout(() => this.hideOcrFeedback(), 4000);
                        this.closeModal();
                    }
                },

                exportJSON() {
                    if (projetores.length === 0) return alert('Nenhum dado para exportar.');
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projetores, null, 2));
                    const a = document.createElement('a');
                    a.href = dataStr;
                    a.download = "mapeamento_projetores_bomjesus.json";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                },

                importJSON(file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const imported = JSON.parse(e.target.result);
                            if (!Array.isArray(imported)) throw new Error('Formato inválido');
                            const map = new Map();
                            projetores.forEach(p => map.set(p.sala, p));
                            imported.forEach(p => map.set(p.sala, p));
                            projetores = Array.from(map.values());
                            this.saveData();
                            alert(`Importação concluída! Total de registros: ${projetores.length}`);
                        } catch (error) {
                            alert('Erro ao processar o arquivo JSON.');
                            console.error(error);
                        }
                    };
                    reader.readAsText(file);
                },

                exportPDF() {
                    if (projetores.length === 0) return alert('Nenhum dado para exportar.');
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    
                    doc.setFontSize(18);
                    doc.setTextColor(20, 83, 45);
                    doc.text('Relatório de Mapeamento de Projetores', 14, 22);
                    doc.setFontSize(11);
                    doc.setTextColor(100);
                    doc.text('Colégio Bom Jesus Porto Belo', 14, 30);
                    doc.text(`Data da vistoria: ${new Date().toLocaleDateString('pt-BR')}`, 14, 36);

                    // Ordena por Patrimônio > Serial > Sala
                    const sorted = [...projetores].sort((a, b) => {
                        let cmpPat = a.patrimonio.localeCompare(b.patrimonio, undefined, { numeric: true, sensitivity: 'base' });
                        if (cmpPat !== 0) return cmpPat;
                        let cmpSer = a.serial.localeCompare(b.serial, undefined, { numeric: true, sensitivity: 'base' });
                        if (cmpSer !== 0) return cmpSer;
                        return a.sala.localeCompare(b.sala, undefined, { numeric: true, sensitivity: 'base' });
                    });

                    // Insere a numeração sequencial como 1ª coluna (1, 2, 3...)
                    const rows = sorted.map((p, index) => [
                        (index + 1).toString(),
                        p.patrimonio || '—', 
                        p.serial || '—', 
                        p.sala || '—'
                    ]);

                    doc.autoTable({
                        startY: 45,
                        head: [['Nº', 'Patrimônio', 'Número de Série', 'Sala']],
                        body: rows,
                        theme: 'striped',
                        headStyles: { fillColor: [20, 83, 45] },
                        columnStyles: {
                            0: { halign: 'center', cellWidth: 15 } // Coluna Nº compacta e centralizada
                        }
                    });
                    
                    doc.save('Mapeamento_Projetores_BomJesus_PortoBelo.pdf');
                },

                init() {
                    this.loadData();

                    DOM.form.addEventListener('submit', (e) => {
                        e.preventDefault();
                        if (isProcessingOCR) {
                            alert('Aguarde o processamento da imagem.');
                            return;
                        }
                        const sala = DOM.sala.value.trim();
                        const patrimonio = DOM.patrimonio.value.trim();
                        const serial = DOM.serial.value.trim();
                        if (!sala || !patrimonio || !serial) {
                            alert('Preencha todos os campos.');
                            return;
                        }

                        const data = {
                            sala,
                            patrimonio,
                            serial,
                            imagem: currentImageBase64 || null,
                            data_registro: new Date().toISOString()
                        };

                        if (editIndex === -1) {
                            projetores.push(data);
                        } else {
                            data.data_registro = projetores[editIndex].data_registro || data.data_registro;
                            projetores[editIndex] = data;
                        }

                        this.saveData();
                        this.cancelEdit();
                        DOM.form.reset();
                        this.clearImagePreview();
                        this.hideOcrFeedback();
                        DOM.sala.focus();
                    });

                    DOM.btnCancelEdit.addEventListener('click', () => {
                        this.cancelEdit();
                        this.hideOcrFeedback();
                    });

                    DOM.cameraInput.addEventListener('change', (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        this.openModal(file);
                        DOM.cameraInput.value = ''; 
                    });

                    DOM.btnRotate.addEventListener('click', () => {
                        if (cropperInstance) {
                            currentBaseRotation += 90;
                            const fineVal = parseInt(DOM.fineRotation.value, 10) || 0;
                            cropperInstance.rotateTo(currentBaseRotation + fineVal);
                        }
                    });

                    DOM.fineRotation.addEventListener('input', (e) => {
                        if (cropperInstance) {
                            const fineVal = parseInt(e.target.value, 10) || 0;
                            cropperInstance.rotateTo(currentBaseRotation + fineVal);
                        }
                    });

                    DOM.btnConfirmCrop.addEventListener('click', () => {
                        this.processCrop();
                    });

                    DOM.btnCancelModal.addEventListener('click', () => {
                        this.closeModal();
                    });

                    DOM.modal.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape') {
                            this.closeModal();
                        }
                    });

                    DOM.btnClearImage.addEventListener('click', () => {
                        this.clearImagePreview();
                    });

                    DOM.btnImport.addEventListener('change', (e) => {
                        const file = e.target.files[0];
                        if (file) this.importJSON(file);
                        DOM.btnImport.value = '';
                    });

                    DOM.btnExport.addEventListener('click', () => this.exportJSON());
                    DOM.btnExportPDF.addEventListener('click', () => this.exportPDF());
                }
            };

            window.App = App;
            App.init();

        })();
    </script>
</body>
</html>
